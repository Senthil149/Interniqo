spring.application.name=internship-platform-backend
server.port=8080

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interniqo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ────────────────────────────────────────────────────────────────────
# The signing key must be provided through the environment.
# Never commit a real JWT secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── CORS ───────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Multipart file upload ───────────────────────────────────────────────────
# Server-side hard cap. Client-side validation also enforces 5 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Resume file storage ─────────────────────────────────────────────────────
# Override via UPLOAD_DIR environment variable in production.
app.upload.dir=${UPLOAD_DIR:uploads/resumes}

# ── Python AI microservice ──────────────────────────────────────────────────
# AI service runs as a separate HTTP service.
# Override via AI_SERVICE_URL when deploying.
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# ── Email & Verification ────────────────────────────────────────────────────
# Verifies inbox control, not legal company identity.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── Blockchain & Smart Contract ─────────────────────────────────────────────
# Local development uses the Hardhat node on port 8545.
# Chain ID: 31337
#
# For real network deployment:
# 1. Set BLOCKCHAIN_RPC_URL to the target network RPC endpoint.
# 2. Set BLOCKCHAIN_CONTRACT_ADDRESS to the deployed contract address.
# 3. Set BLOCKCHAIN_NETWORK to the target network name.
# 4. Set BLOCKCHAIN_PRIVATE_KEY through a secure environment variable.
# 5. Never commit a real private key.

blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
blockchain.network=${BLOCKCHAIN_NETWORK:hardhat-local}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY}